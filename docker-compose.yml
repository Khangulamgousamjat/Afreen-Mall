version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: afreen_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afreen_mall
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: afreen_redis
    restart: always
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: afreen_api
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/afreen_mall?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: afreen_web
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  postgres_data:
