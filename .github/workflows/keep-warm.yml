name: Keep Backend Warm

on:
  schedule:
    # Run every 12 minutes to prevent Render free-tier cold starts (~15m idle limit)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Afreen Mall API Health Endpoint
        run: |
          curl -s -f https://afreen-mall.onrender.com/health || echo "Backend wake ping sent"
