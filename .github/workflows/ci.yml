name: CI — Typecheck & Integration Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afreen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afreen_test
      JWT_SECRET: test_jwt_secret_afreen_mall_ci
      JWT_REFRESH_SECRET: test_refresh_secret_afreen_mall_ci
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run DB migrations on test database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Typecheck — shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Typecheck — API (tsc --noEmit)
        run: tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck — Web (tsc + vite)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run integration tests
        working-directory: apps/api
        run: npm test
